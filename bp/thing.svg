<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

      <head>

        <!-- SVG/XHTML DOM PATCH -->
        <script>
        (function () {
          const XHTML_NS = "http://www.w3.org/1999/xhtml";

          const root =
            document.querySelector("foreignObject").firstElementChild;

          const head = root.querySelector("head");
          const body = root.querySelector("body");

          const originalCreateElement =
            document.createElement.bind(document);

          const originalCreateElementNS =
            document.createElementNS.bind(document);

          Object.defineProperty(document, "head", {
            get() { return head; },
            configurable: true
          });

          Object.defineProperty(document, "body", {
            get() { return body; },
            configurable: true
          });

          Object.defineProperty(document, "documentElement", {
            get() { return root; },
            configurable: true
          });

          document.createElement = function(tagName, options) {
            if (typeof tagName === "string") {
              return originalCreateElementNS(
                XHTML_NS,
                tagName,
                options
              );
            }
            return originalCreateElement(tagName, options);
          };

          document.createElementNS = function(
            namespaceURI,
            qualifiedName,
            options
          ) {
            if (
              namespaceURI == null ||
              namespaceURI === XHTML_NS
            ) {
              return originalCreateElementNS(
                XHTML_NS,
                qualifiedName,
                options
              );
            }

            return originalCreateElementNS(
              namespaceURI,
              qualifiedName,
              options
            );
          };

          if (!location.hash) {
            history.replaceState(history.state, "", "#/");
          }
        })();
        </script>

        <!-- HOMEBASE STYLES -->
        <style><![CDATA[

          :root{
            --bg:#101112;
            --accent:#2944d9;
            --text:#c8cdd6;
            --text-dim:#5a6070;
            --text-bright:#e8ecf4;
            --border:rgba(41,68,217,.35);
            --panel-bg:rgba(14,15,17,.88);
          }

          html,
          body{
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
            background:#101112;
            font-family:monospace;
          }

          #app{
            position:relative;
            width:100vw;
            height:100vh;
            overflow:hidden;
            background:#101112;
            color:var(--text);
          }

          #bg{
            position:absolute;
            inset:0;
            background:url(
              https://images5.alphacoders.com/116/thumb-1920-1166049.jpg
            ) center/cover no-repeat;

            filter:brightness(.28) saturate(.6);
          }

          #main-title{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            z-index:5;
            text-align:center;
          }

          .title{
            font-size:5rem;
            letter-spacing:.3em;
            color:white;
            text-shadow:
              0 0 40px rgba(41,68,217,.5),
              0 0 80px rgba(41,68,217,.2);
          }

          #panel-group{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            display:flex;
            gap:14px;
            z-index:20;
          }

          .panel{
            width:260px;
            min-height:300px;

            background:rgba(14,15,17,.88);

            border:1px solid rgba(41,68,217,.35);

            backdrop-filter:blur(12px);

            padding:14px;
          }

          .panel-title{
            color:#2944d9;
            text-transform:uppercase;
            letter-spacing:.2em;
            margin-bottom:16px;
          }

          .menu-btn{
            width:100%;
            padding:10px 14px;
            margin-bottom:8px;

            background:rgba(41,68,217,.05);

            border:1px solid rgba(41,68,217,.2);

            color:#c8cdd6;

            cursor:pointer;
          }

          .menu-btn:hover{
            background:rgba(41,68,217,.18);
          }

        ]]></style>

      </head>

      <body>

        <div id="app">

          <div id="bg"></div>

          <div id="main-title">
            <div class="title">
              HOMEBASE
            </div>
          </div>

          <div id="panel-group">

            <div class="panel">
              <div class="panel-title">
                Network
              </div>

              <div>Status: Online</div>
              <div>RTT: 14ms</div>
              <div>Downlink: 120Mbps</div>
            </div>

            <div class="panel">
              <div class="panel-title">
                Menu
              </div>

              <button class="menu-btn">
                Yuki OS
              </button>

              <button class="menu-btn">
                Lucide
              </button>

              <button class="menu-btn">
                Petezah
              </button>

            </div>

            <div class="panel">
              <div class="panel-title">
                System
              </div>

              <div>Battery: 72%</div>
              <div>Storage: 14 Items</div>
              <div>Language: en-US</div>
            </div>

          </div>

        </div>

        <!-- HOMEBASE SCRIPT -->
        <script>

          console.log("HOMEBASE booted inside SVG");

          document
            .querySelectorAll(".menu-btn")
            .forEach(btn => {

              btn.onclick = () => {
                console.log(btn.textContent);
              };

            });

        </script>

      </body>

    </html>

  </foreignObject>
</svg>
