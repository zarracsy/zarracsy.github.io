<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="1920"
    height="1080"
    viewBox="0 0 1920 1080">

    <foreignObject width="100%" height="100%">
        <html xmlns="http://www.w3.org/1999/xhtml">
            <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />

                <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;family=Rajdhani:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>

                <style>
                    :root {
                      --bg: #101112;
                      --accent: #2944d9;
                      --accent-dim: rgba(41,68,217,0.18);
                      --accent-glow: rgba(41,68,217,0.45);
                      --text: #c8cdd6;
                      --text-dim: #5a6070;
                      --text-bright: #e8ecf4;
                      --border: rgba(41,68,217,0.35);
                      --panel-bg: rgba(14,15,17,0.88);
                      --mono: 'Share Tech Mono', monospace;
                      --sans: 'Rajdhani', sans-serif;
                    }

                    *, *::before, *::after {
                      box-sizing: border-box;
                      margin: 0;
                      padding: 0;
                    }

                    html, body {
                      width: 100%;
                      height: 100%;
                      background: var(--bg);
                      color: var(--text);
                      font-family: var(--mono);
                      overflow: hidden;
                    }

                    #bg {
                      position: fixed;
                      inset: 0;
                      z-index: 0;
                      background: url('https://images5.alphacoders.com/116/thumb-1920-1166049.jpg') center/cover no-repeat;
                      filter: brightness(0.28) saturate(0.6);
                    }

                    #main {
                      position: relative;
                      z-index: 2;
                      width: 100%;
                      height: 100%;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      flex-direction: column;
                    }

                    .title {
                      font-family: var(--sans);
                      font-size: 5rem;
                      font-weight: 700;
                      letter-spacing: 0.3em;
                      text-transform: uppercase;
                      color: var(--text-bright);
                      text-shadow:
                        0 0 40px rgba(41,68,217,0.5),
                        0 0 80px rgba(41,68,217,0.2);
                    }

                    .sub {
                      margin-top: 10px;
                      font-size: 0.8rem;
                      letter-spacing: 0.35em;
                      color: var(--text-dim);
                      text-transform: uppercase;
                    }

                    .menu {
                      margin-top: 40px;
                      display: flex;
                      flex-direction: column;
                      gap: 12px;
                      width: 320px;
                    }

                    .menu button {
                      font-family: var(--mono);
                      font-size: 0.72rem;
                      letter-spacing: 0.1em;
                      text-transform: uppercase;
                      color: var(--text);
                      background: rgba(41,68,217,0.04);
                      border: 1px solid rgba(41,68,217,0.2);
                      padding: 12px 14px;
                      cursor: pointer;
                      transition: 0.2s;
                    }

                    .menu button:hover {
                      background: var(--accent-dim);
                      border-color: var(--accent);
                      color: #fff;
                      box-shadow: 0 0 10px rgba(41,68,217,0.25);
                    }

                    #clock {
                      position: fixed;
                      top: 20px;
                      right: 24px;
                      color: var(--text);
                      font-size: 0.8rem;
                      letter-spacing: 0.2em;
                    }

                    #battery {
                      position: fixed;
                      top: 20px;
                      left: 24px;
                      color: var(--text);
                      font-size: 0.8rem;
                      letter-spacing: 0.2em;
                    }

                    #ip {
                      position: fixed;
                      bottom: 20px;
                      right: 24px;
                      color: var(--text-dim);
                      font-size: 0.7rem;
                    }

                    #topline {
                      position: fixed;
                      top: 0;
                      left: 0;
                      width: 100%;
                      height: 1px;
                      background: linear-gradient(
                        90deg,
                        transparent,
                        var(--accent),
                        transparent
                      );
                    }
                </style>
            </head>

            <body>
                <div id="bg"></div>
                <div id="topline"></div>

                <div id="battery">BATTERY: --%</div>
                <div id="clock">--:--:--</div>
                <div id="ip">IP: Fetching...</div>

                <div id="main">
                    <div class="title">Placeholder</div>
                    <div class="sub">System Interface</div>

                    <div class="menu">
                        <button onclick="openPage('https://quantil.jsdelivr.net/gh/reeyuki/YukiOsSingleHtml@main/yukios.svg')">
                            Yuki OS
                        </button>

                        <button onclick="openPage('https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/')">
                            Lucide
                        </button>

                        <button onclick="openPage('https://originfastly.jsdelivr.net/gh/PeteZah-G/PeteZahStaticDone@959d81f/new.svg')">
                            Petezah
                        </button>

                        <button onclick="openPage('https://cdn.jsdelivr.net/gh/avaisadev/github.com@latest/index.svg')">
                            Nikehub
                        </button>

                        <button onclick="openPage('https://d1w7oj52hl4x53.cloudfront.net/')">
                            Fern
                        </button>
                    </div>
                </div>

                <script><![CDATA[
                    function updateClock() {
                        const now = new Date();

                        const h = String(now.getHours()).padStart(2, '0');
                        const m = String(now.getMinutes()).padStart(2, '0');
                        const s = String(now.getSeconds()).padStart(2, '0');

                        document.getElementById('clock').textContent =
                            `${h}:${m}:${s}`;
                    }

                    setInterval(updateClock, 1000);
                    updateClock();

                    async function initBattery() {
                        if (!navigator.getBattery) return;

                        const battery = await navigator.getBattery();

                        function render() {
                            const pct = Math.round(battery.level * 100);

                            document.getElementById('battery').textContent =
                                `BATTERY: ${pct}%`;
                        }

                        render();

                        battery.addEventListener('levelchange', render);
                    }

                    initBattery();

                    async function fetchIP() {
                        try {
                            const r = await fetch(
                                'https://api.ipify.org?format=json'
                            );

                            const d = await r.json();

                            document.getElementById('ip').textContent =
                                'IP: ' + d.ip;
                        } catch (e) {
                            document.getElementById('ip').textContent =
                                'IP: Unavailable';
                        }
                    }

                    fetchIP();

                    function openPage(url) {
                        const win = window.open('about:blank', '_blank');

                        if (!win) return;

                        const iframe = win.document.createElement('iframe');

                        iframe.src = url;

                        iframe.style.cssText = `
                            position:fixed;
                            inset:0;
                            width:100vw;
                            height:100vh;
                            border:none;
                        `;

                        win.document.body.style.margin = '0';
                        win.document.body.appendChild(iframe);
                    }
                ]]></script>
            </body>
        </html>
    </foreignObject>
</svg>
