<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">

    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">

      <head>

        <script>
        (function(){

          const XHTML_NS = "http://www.w3.org/1999/xhtml";

          const root = document.querySelector("foreignObject").firstElementChild;
          const head = root.querySelector("head");
          const body = root.querySelector("body");

          const originalCreateElement = document.createElement.bind(document);
          const originalCreateElementNS = document.createElementNS.bind(document);

          Object.defineProperty(document,"head",{
            get(){ return head },
            configurable:true
          });

          Object.defineProperty(document,"body",{
            get(){ return body },
            configurable:true
          });

          Object.defineProperty(document,"documentElement",{
            get(){ return root },
            configurable:true
          });

          document.createElement = function(tagName, options){
            if(typeof tagName === "string"){
              return originalCreateElementNS(XHTML_NS, tagName, options);
            }
            return originalCreateElement(tagName, options);
          };

          document.createElementNS = function(namespaceURI, qualifiedName, options){
            if(namespaceURI == null || namespaceURI === XHTML_NS){
              return originalCreateElementNS(XHTML_NS, qualifiedName, options);
            }
            return originalCreateElementNS(namespaceURI, qualifiedName, options);
          };

          if(!location.hash){
            history.replaceState(history.state, "", "#/");
          }

        })();
        </script>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>SVG Boot Menu</title>

        <style><![CDATA[

          html,
          body{
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
            background:black;
            font-family:monospace;
          }

          body{
            background:
              radial-gradient(circle at top right, rgba(0,255,255,.12), transparent 35%),
              radial-gradient(circle at bottom left, rgba(0,255,255,.08), transparent 40%),
              linear-gradient(135deg,#020202,#0b1018);
            color:white;
          }

          *{
            box-sizing:border-box;
          }

          .scanlines{
            position:fixed;
            inset:0;
            pointer-events:none;
            opacity:.06;
            background:
              repeating-linear-gradient(
                to bottom,
                white 0px,
                white 2px,
                transparent 2px,
                transparent 4px
              );
            mix-blend-mode:screen;
          }

          .boot-container{
            position:relative;
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:90px;
          }

          .left{
            width:620px;
          }

          .title{
            font-size:58px;
            font-weight:bold;
            letter-spacing:4px;
            margin-bottom:14px;
            text-shadow:0 0 20px cyan;
          }

          .subtitle{
            color:#8d8d8d;
            margin-bottom:45px;
            font-size:18px;
          }

          .menu{
            display:flex;
            flex-direction:column;
            gap:18px;
          }

          .button{
            padding:24px 28px;
            border-radius:20px;
            background:rgba(15,15,15,.88);
            border:2px solid rgba(0,255,255,.7);
            cursor:pointer;
            transition:.22s;
            font-size:24px;
            font-weight:bold;
            backdrop-filter:blur(10px);
            box-shadow:0 0 25px rgba(0,255,255,.18);
            user-select:none;
          }

          .button:hover{
            transform:translateX(14px);
            box-shadow:0 0 40px cyan;
            border-color:cyan;
          }

          .button small{
            display:block;
            margin-top:7px;
            color:#8d8d8d;
            font-size:13px;
            font-weight:normal;
          }

          .right-panel{
            width:420px;
            border-radius:28px;
            border:2px solid rgba(0,255,255,.3);
            background:rgba(10,10,10,.68);
            backdrop-filter:blur(16px);
            padding:34px;
            box-shadow:0 0 60px rgba(0,255,255,.14);
          }

          .panel-title{
            font-size:32px;
            margin-bottom:26px;
            text-shadow:0 0 15px cyan;
          }

          .status{
            display:flex;
            justify-content:space-between;
            margin-bottom:18px;
            font-size:17px;
          }

          .ok{
            color:#7fffb2;
          }

          .footer{
            position:fixed;
            left:40px;
            bottom:20px;
            color:#666;
            font-size:12px;
            letter-spacing:1px;
          }

          .boot-circle{
            position:fixed;
            border-radius:50%;
            filter:blur(80px);
            pointer-events:none;
          }

          .circle1{
            width:400px;
            height:400px;
            background:rgba(0,255,255,.12);
            top:-120px;
            right:-80px;
          }

          .circle2{
            width:500px;
            height:500px;
            background:rgba(0,255,255,.07);
            left:-150px;
            bottom:-150px;
          }

        ]]></style>

      </head>

      <body>

        <div class="boot-circle circle1"></div>
        <div class="boot-circle circle2"></div>

        <div class="scanlines"></div>

        <div class="boot-container">

          <div class="left">

            <div class="title">
              SYSTEM BOOT MENU
            </div>

            <div class="subtitle">
              _____________________________________________________________________
            </div>

            <div class="menu">

              <div class="button"
                   onclick="launchSite('https://quantil.jsdelivr.net/gh/reeyuki/YukiOsSingleHtml@main/yukios.svg')">

                ▶ Yuki OS

                <small>
                  (desktop environment)
                </small>

              </div>

              <div class="button"
                   onclick="launchSite('https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/')">

                ▶ Lucide Browser

                <small>
                  (proxy)
                </small>

              </div>

              <div class="button"
                   onclick="launchSite('https://originfastly.jsdelivr.net/gh/PeteZah-G/PeteZahStaticDone@959d81f/new.svg')">

                ▶ Petezah Browser

                <small>
                  (proxy 2)
                </small>

              </div>

              <div class="button"
                   onclick="launchSite('https://cdn.jsdelivr.net/gh/avaisadev/github.com@latest/index.svg')">

                ▶ Nikehub

                <small>
                  (games site)
                </small>

              </div>

              <div class="button"
                   onclick="launchSite('https://gcore.jsdelivr.net/gh/Stellite-Games/cdn-build@master/logo.svg#/')">

                ▶ Stellite Games

                <small>
                  (games)
                </small>

              </div>

            </div>

          </div>

          <div class="right-panel">

          </div>

        </div>

        <script>

        function launchSite(url){

          const win = window.open("about:blank", "_blank");

          if(!win){
            alert("Popup blocked.");
            return;
          }

          const iframe = win.document.createElement("iframe");

          iframe.src = url;

          iframe.style.position = "fixed";
          iframe.style.inset = "0";
          iframe.style.width = "100vw";
          iframe.style.height = "100vh";
          iframe.style.border = "none";

          win.document.body.style.margin = "0";

          win.document.body.appendChild(iframe);

        }

        </script>

      </body>

    </html>

  </foreignObject>
</svg>
